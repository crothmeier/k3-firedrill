# .github/workflows/secrets-scan.yaml — k3-firedrill public repo
# Drafted by Operation_Dossier 2026-09-11 per Arsenal section 4a (gitleaks + TruffleHog, full history).
# rev 2 (2026-09-11): run 34575839738 failed at 6881056 with "flag 'fail' cannot be repeated" - the action
#   already passes --fail; extra_args must not.
# rev 3 (2026-09-11): run 34576128067 at 458c674 was green but NOT full history - on a push event both
#   actions default to the push range (TruffleHog log: base 6881056 head 458c674, 3 chunks / 522 bytes).
#   gitleaks now runs the CLI container with --log-opts=--all --full-history on every event; TruffleHog
#   gets base "" + head <branch>, which the action documents as "scan the entire branch".
# Operator copies this file into the public repo and commits by hand.
name: secrets-scan

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks git scan, all refs, full history
        run: |
          docker run --rm -v "$PWD:/repo" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" ghcr.io/gitleaks/gitleaks:latest git /repo --log-opts="--all --full-history" --redact --verbose --exit-code 1

  trufflehog:
    name: TruffleHog (full history, verified + unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
