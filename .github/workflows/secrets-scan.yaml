# .github/workflows/secrets-scan.yaml — k3-firedrill public repo
# Drafted by Operation_Dossier 2026-09-11 per Arsenal section 4a (gitleaks + TruffleHog, full history).
# rev 2 (2026-09-11): run 34575839738 failed at 6881056 with "flag 'fail' cannot be repeated" - the action
# already passes --fail; extra_args must not. base/head dropped: with neither set the action scans the whole repo.
# Operator copies this file into the public repo and commits by hand.
name: secrets-scan

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  trufflehog:
    name: TruffleHog (full history, verified + unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
